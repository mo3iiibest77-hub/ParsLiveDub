<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParsLiveDub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🎙️ ParsLiveDub</div>
      <div class="subtitle">دوبله زنده هوشمند فارسی</div>
    </header>

    <div class="status-card">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">آماده</span>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn primary">▶ شروع دوبله</button>
      <button id="stopBtn" class="btn danger" hidden>■ توقف</button>
    </div>

    <div class="hint">
      کلید API را در <a href="#" id="openSettings">تنظیمات</a> وارد کنید.
    </div>

    <footer>نسخه ۱.۰.۰ • Gemini Live Translate</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
