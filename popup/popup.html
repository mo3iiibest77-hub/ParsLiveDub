<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParsLiveDub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark">PLD</div>
      <div>
        <h1>ParsLiveDub</h1>
        <p class="tag">Live dub · lipsync · 70+ languages</p>
      </div>
    </header>

    <div id="statusCard" class="status idle">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Ready</span>
    </div>
    <p id="errorText" class="error" hidden></p>
    <p id="metaText" class="meta" hidden></p>

    <label class="field">
      Target language
      <select id="langSelect"></select>
    </label>

    <label class="field">
      Gemini API key
      <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off">
    </label>

    <label class="switch-row">
      <span>
        Lipsync video
        <small>Delay picture to match Gemini, not the captured audio</small>
      </span>
      <input id="lipsyncToggle" type="checkbox" checked>
    </label>

    <label class="field">
      Sync delay
      <select id="delaySelect">
        <option value="0">Auto (measure Gemini)</option>
        <option value="2000">2.0 s</option>
        <option value="2500">2.5 s</option>
        <option value="2900">2.9 s</option>
        <option value="3200">3.2 s</option>
        <option value="3600">3.6 s</option>
        <option value="4000">4.0 s</option>
        <option value="4500">4.5 s</option>
      </select>
    </label>

    <label class="switch-row">
      <span>
        Match male / female
        <small>Pitch-correct if Gemini flips gender</small>
      </span>
      <input id="genderToggle" type="checkbox" checked>
    </label>

    <button id="toggleBtn" class="primary">Start dubbing</button>
    <button id="testBtn" class="ghost" type="button">Test Gemini connection</button>

    <p class="hint">
      Play the video tab first. Refresh YouTube after installing. Turn off other dubbing extensions.
      Key from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.
    </p>
    <footer>v1.6.6 · Gemini Live Translate</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
